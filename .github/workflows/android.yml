name: Build and Release Android APK

on:
  push:
    branches: [master, fix/android-keyboard-features]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build Android APK
        run: |
          gradle --no-daemon clean assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/depth-keyboard.apk

      - name: Read app version
        id: version
        run: |
          VERSION_CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | grep -o '[0-9]*')
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        run: |
          {
            echo "# Depth Keyboard Android"
            echo
            echo "versionCode: ${{ steps.version.outputs.code }}"
            echo "versionName: ${{ steps.version.outputs.name }}"
            echo
            echo "This release is used by the in-app update system."
            echo "The APK asset is named depth-keyboard.apk."
            echo
            echo "## Smart typing"
            echo "- Local autocorrect with an expanded spelling correction set."
            echo "- Next-word prediction combining local model, dictionary and personalized learned words."
            echo "- Sentence capitalization, punctuation spacing and one-tap Fix/polish."
            echo "- Double-space period, caps lock, long-press alternate characters and Flow/swipe input."
            echo
            echo "## Keyboard controls"
            echo "- QWERTY, QWERTZ, AZERTY, DVORAK and COLEMAK."
            echo "- Language switching through the installed language catalog."
            echo "- Standard, one-handed, floating, split/thumb, tablet and compact layout controls."
            echo "- Adjustable size, width, height, optional number row, haptics, sounds and high contrast."
            echo
            echo "## Rich input"
            echo "- Emoji categories and recent emoji history."
            echo "- Local clipboard history with clear/delete controls."
            echo "- Voice entry through Android speech recognition."
            echo "- Search from the keyboard."
            echo "- Translation, GIF/sticker and AI provider hooks without embedded secrets."
            echo
            echo "## Privacy"
            echo "- Local-first personalization and clipboard storage."
            echo "- Incognito mode stops personalization and clipboard capture."
            echo "- Cloud sync/account settings are opt-in provider hooks."
            echo
            echo "## Architecture"
            echo "- Modular editor, privacy, NLP, media, voice, translator, sync, extension and layout components."
            echo "- Provider-neutral AI contract for backend-based AI, rewrite, translation and search."
          } > release-notes.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: depth-keyboard-apk
          path: android/app/build/outputs/apk/debug/depth-keyboard.apk
          if-no-files-found: error

      - name: Publish GitHub Release and APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'release:'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          name: Depth Keyboard ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: android/release-notes.md
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/depth-keyboard.apk
          fail_on_unmatched_files: true
