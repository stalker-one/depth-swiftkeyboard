name: Build and Release Android APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/depth-keyboard.apk

      - name: Prepare release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION_CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | grep -o '[0-9]*')
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          {
            echo "# Depth Keyboard Android"
            echo
            echo "versionCode: ${VERSION_CODE}"
            echo "versionName: ${VERSION_NAME}"
            echo
            echo "This release is used by the in-app required update system."
          } > release-notes.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: depth-keyboard-apk
          path: android/app/build/outputs/apk/debug/depth-keyboard.apk

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: android/release-notes.md
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/depth-keyboard.apk
