name: Build and Release Android APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build Android APK
        run: |
          gradle --no-daemon clean assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/depth-keyboard.apk

      - name: Read app version
        id: version
        run: |
          VERSION_CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | grep -o '[0-9]*')
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        run: |
          {
            echo "# Depth Keyboard Android"
            echo
            echo "versionCode: ${{ steps.version.outputs.code }}"
            echo "versionName: ${{ steps.version.outputs.name }}"
            echo
            echo "This release is used by the in-app update system."
            echo "The APK asset is named depth-keyboard.apk."
            echo
            echo "## Features"
            echo
            echo "### Smart typing"
            echo "- Next-word suggestions, local personalization, autocorrect, and common grammar corrections."
            echo "- Double-space punctuation, shift/caps lock, long-press accent input, and flow/swipe typing."
            echo "- Local learned words with an option to clear personalization data."
            echo
            echo "### Layouts and languages"
            echo "- QWERTY, QWERTZ, AZERTY, DVORAK, and COLEMAK layouts."
            echo "- English, Urdu, Arabic, Spanish, French, German, Italian, Portuguese, and Turkish language options."
            echo "- Standard, one-handed, floating, split/thumb, compact, adjustable size, width, height, and optional number row."
            echo
            echo "### Rich input and customization"
            echo "- Categorized emoji picker with recent emoji history."
            echo "- Local clipboard history with clear controls."
            echo "- Theme selection, custom colors, high contrast, smartbar, search, and keyboard settings access."
            echo "- Optional haptic feedback, key sounds, key pop-up setting, and incognito mode."
            echo
            echo "### Privacy"
            echo "- Local-first typing data and clipboard storage."
            echo "- Incognito mode disables learning and clipboard capture."
            echo "- Online translation, GIFs, stickers, voice transcription, cloud sync, and external AI providers are not bundled in this APK."
          } > release-notes.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: depth-keyboard-apk
          path: android/app/build/outputs/apk/debug/depth-keyboard.apk
          if-no-files-found: error

      - name: Publish GitHub Release and APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Depth Keyboard ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: android/release-notes.md
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/depth-keyboard.apk
          fail_on_unmatched_files: true
