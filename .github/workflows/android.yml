name: Build and Release Android APK

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build Android APK
        run: |
          gradle --no-daemon clean assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/depth-keyboard.apk

      - name: Read app version
        id: version
        run: |
          VERSION_CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | grep -o '[0-9]*')
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        run: |
          {
            echo "# Depth Keyboard Android"
            echo
            echo "versionCode: ${{ steps.version.outputs.code }}"
            echo "versionName: ${{ steps.version.outputs.name }}"
            echo
            echo "This release is used by the in-app update system."
            echo "The APK asset is named depth-keyboard.apk."
            echo
            echo "## Features"
            echo
            echo "### AI and writing assistance"
            echo "- Copilot Chat for research, ideas, planning, and writing without leaving the current app."
            echo "- AI Tone and Rewrite with Professional, Casual, Polite, and Social Post styles."
            echo "- Writing assistance for improving wording, correcting grammar, restructuring sentences, and suggesting alternatives."
            echo "- Microsoft Translator built into the keyboard with support for 60+ languages."
            echo
            echo "### Smart typing"
            echo "- Next-word prediction and personalized predictions based on typing behavior."
            echo "- Automatic autocorrect and common grammar/error correction."
            echo "- Flow/swipe typing for sliding across letters."
            echo "- Personal dictionary for frequently used words and phrases."
            echo
            echo "### Voice and rich input"
            echo "- Voice typing with multimodal dictation while the keyboard remains available."
            echo "- Emoji collection with categories and search."
            echo "- GIF search and static or animated stickers."
            echo "- Clipboard history and shortcuts for reusable phrases."
            echo
            echo "### Customization and layouts"
            echo "- Hundreds of keyboard themes plus custom and photo themes."
            echo "- Customizable toolbar with quick access to frequently used tools."
            echo "- QWERTY and alternate layouts, one-handed mode, floating keyboard, and thumb/split layout."
            echo "- Adjustable keyboard size and toolbar language switching."
            echo
            echo "### Languages and privacy"
            echo "- Multilingual typing with language-specific predictions and fast language switching."
            echo "- On-device learning by default, with optional Backup & Sync when signed in."
            echo "- Incognito mode, personalization controls, and learned-language-data management."
            echo
            echo "### Toolbar tools"
            echo "- Settings, account management, keyboard layout switcher, resize, and autocorrect controls."
            echo "- Voice-to-text, Messaging Center, Search, Themes, GIFs, Stickers, Clipboard, Emoji, Translator, Copilot, Tone, and Chat."
          } > release-notes.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: depth-keyboard-apk
          path: android/app/build/outputs/apk/debug/depth-keyboard.apk
          if-no-files-found: error

      - name: Publish GitHub Release and APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Depth Keyboard ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: android/release-notes.md
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/depth-keyboard.apk
          fail_on_unmatched_files: true
